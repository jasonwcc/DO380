apiVersion: oadp.openshift.io/v1alpha1
kind: DataProtectionApplication
metadata:
  name: oadp-config
  namespace: CHANGE_ME
spec:
  backupLocations:
  - velero:
      config:
        insecureSkipTLSVerify: 'true'
        profile: default
        region: us-east-1
        s3ForcePathStyle: 'true'
        s3Url: https://s3.openshift-storage.svc
      credential:
        key: cloud
        name: cloud-credentials
      default: true
      objectStorage:
        bucket: backup-86004344-7bd4-48ab-ad25-83e57c03fa8d
        caCert: 
        prefix: oadp
      provider: aws
  configuration:
    nodeAgent: {}
    velero: {}
