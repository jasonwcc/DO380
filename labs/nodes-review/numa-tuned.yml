apiVersion: tuned.openshift.io/v1
kind: Tuned
metadata:
  name: CHANGE_ME
  namespace: openshift-cluster-node-tuning-operator
spec:
  profile:
  - data: |
      [main]
      summary=Custom NUMA balancing profile
      include=CHANGE_ME
      [sysctl]
      kernel.numa_balancing=1
    name: kernel-numabal
  recommend:
  - machineConfigLabels:
      CHANGE_ME
    priority: 30
    profile: CHANGE_ME
